<!-- 分部词频区块的侧栏图标，20×20。
     图形是一页被两条横线分成三段的文档，对应「按部分统计」。
     描边色写死成紫色（#8b5cf6），与翻译的 accent-blue、整本词频的 accent-green 区分。
     同一份路径在 16×16 下描边权重取 2，这里取 1.8，两个尺寸看起来一样粗。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="3" width="18" height="18" rx="2"/>
  <path d="M3 9h18M3 15h18"/>
</svg>
